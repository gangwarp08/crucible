name: Daily cost alert

# Sums yesterday's cost_ledger and fails if total spend >= threshold.
# A failed workflow run triggers GitHub's native email to the repo owner
# (settings → notifications → workflows). No external alerting service.
#
# Schedule: 09:00 UTC daily, when "yesterday UTC" is fully closed.
# Manual fire via "Run workflow" if you want a snapshot mid-day.

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      threshold:
        description: "Override daily threshold USD (default 10)"
        required: false
        default: "10"
      day:
        description: "Override target UTC day YYYY-MM-DD (default = yesterday)"
        required: false

jobs:
  rollup:
    name: rollup + threshold check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      COST_ALERT_THRESHOLD_USD: ${{ inputs.threshold || '10' }}
      COST_DAY: ${{ inputs.day || '' }}
      # Stub the env vars env.ts validates so the script's transitive imports
      # (if any) don't choke. The script itself only uses SUPABASE_* above.
      LITELLM_BASE_URL: https://ci-stub.invalid
      LITELLM_MASTER_KEY: ci-stub
      E2B_API_KEY: ci-stub
      JWT_SECRET: ci-stub-jwt-secret-at-least-32-characters-long-padding

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        # Version comes from "packageManager" in package.json (single source of
        # truth); pinning it here too makes action-setup@v4 error on the mismatch.
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run cost rollup
        run: pnpm --filter @crucible/server exec tsx scripts/check-daily-cost.ts
